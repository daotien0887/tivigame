    assert(new Set(TANK_LEVELS[3].weapons.map(weapon => weapon.ammunition.kind)).size === 3
        && AMMUNITION.shell.attack !== AMMUNITION.bullet.attack && AMMUNITION.mortar.attack > AMMUNITION.shell.attack,
        'cannon, rotary gun and mortar retain different ammunition and attack values');
    assert(AMMUNITION.bomb.kind === 'bomb' && AMMUNITION.bomb.defense > AMMUNITION.bullet.defense,
        'air-dropped bombs have separate combat stats');
    const damaged = projectile('A', { health: 5, maxHealth: 5 });
    const waiting = projectile('A'); queue.clear(); queue.sync([damaged, waiting, planeTarget]);
    assert(queue.take('A') === damaged, 'durable target starts at the head of its letter queue');
    damaged.health -= 2; queue.release(damaged.id); queue.sync([waiting, damaged, planeTarget]);
    assert(queue.take('A') === damaged, 'partially damaged target retains its original FIFO position');
    game.start(); game.spawnTime = 100; game.enemies = [{ ...queuePlane, health: 1 }];
    const durable = projectile('A', { health: 5, maxHealth: 5, progress: 0, startX: 700, startY: 450, duration: 100 });
    const nextBullet = projectile('A', { progress: 0, startX: 750, x: 750, startY: 450, duration: 100 });
    game.projectiles = [durable, nextBullet]; game.intercept('A');
    for (let frame = 0; frame < 180 && durable.health === 5; frame++) game.update(1 / 60);
    assert(durable.health === 3 && game.projectiles.includes(durable), 'attack below projectile defense leaves remaining durability');
    assert(!game.player.weapons[0].hasPendingTarget && nextBullet.health === 1, 'partial hit frees only its gun and does not damage other targets');
    game.intercept('A');
    assert(game.player.weapons[0].pendingTargetIds[0] === durable.id, 'next correct letter targets the damaged bullet before later bullets and aircraft');
    for (let frame = 0; frame < 180 && durable.health === 3; frame++) game.update(1 / 60);
    assert(durable.health === 1 && game.projectiles.includes(durable), 'second shell accumulates damage without premature destruction');
    game.intercept('A');
    for (let frame = 0; frame < 180 && durable.health > 0; frame++) game.update(1 / 60);
    assert(durable.health === 0 && !game.projectiles.includes(durable) && nextBullet.health === 1,
        'three attack-two shells destroy defense-five target and cannot spill damage');
    const baseHealth = game.health;
    game.projectiles = [projectile('B', { bomb: true, health: 1, maxHealth: AMMUNITION.bomb.defense,
        ammunition: AMMUNITION.bomb, progress: 0.999, duration: 0.1 })];
    game.update(1 / 60);
    assert(game.health === baseHealth - AMMUNITION.bomb.attack, 'bomb damage to the tank uses attack instead of remaining defense');
    game.start(); game.enemies = [game.enemies.find(enemy => enemy.kind === 'plane')];
    game.enemies[0].x = 900; game.spawnTime = 0; game.update(1 / 60);
    const spawnedBomb = game.projectiles.find(projectile => projectile.bomb);
    assert(spawnedBomb.ammunition.kind === 'bomb' && spawnedBomb.health === AMMUNITION.bomb.defense
        && spawnedBomb.maxHealth === AMMUNITION.bomb.defense, 'spawned bombs initialize their own defense pool');
    assert(spawnedBomb.ammunition.image === ENEMY_AIRCRAFT[game.enemies[0].variant].ammunition.image, 'spawned bombs use their aircraft illustration');
    for (const [variant, type] of ENEMY_AIRCRAFT.entries()) {
        game.start();
        const plane = { id: 700 + variant, kind: 'plane', variant, letter: 'Q', x: 900, y: 250, health: 1, maxHealth: 1, flash: 0 };
        game.enemies = [plane]; game.spawnTime = 0; game.update(1 / 60);
        const bomb = game.projectiles.find(projectile => projectile.sourceId === plane.id);
        assert(bomb?.ammunition.image === type.ammunition.image && bomb.letter === plane.letter, `${type.name}: gameplay emits matching letter and bomb image`);
        assert(same({ x: bomb.startX, y: bomb.startY }, aircraftDropPoint(plane, game.elapsed)), `${type.name}: gameplay drop position matches animated bay`);
        const drawn = [], drawImage = game.ctx.drawImage;
        game.ctx.drawImage = function (...args) { drawn.push(args[0]); return drawImage.apply(this, args); };
        game.drawProjectile(bomb); game.ctx.drawImage = drawImage;
        assert(drawn.includes(sprite(type.ammunition.image)), `${type.name}: incoming bomb renderer uses its illustration`);
    }
    game.start(); const armoredShooter = game.enemies.find(enemy => enemy instanceof EnemyTank);
    armoredShooter.x = 1045; game.enemies = [armoredShooter]; game.spawnTime = 0; game.update(1 / 60);
    const spawnedShell = game.projectiles.find(projectile => !projectile.bomb);
    assert(spawnedShell.health === armoredShooter.weapons[0].definition.ammunition.defense
        && spawnedShell.maxHealth === spawnedShell.health, 'enemy rounds inherit the firing gun ammunition defense');
    const loadouts = TANK_LEVELS[3].weapons;
    const rapid = weapons.create(loadouts.find(weapon => weapon.kind === 'rotary'));
    const heavy = weapons.create(loadouts.find(weapon => weapon.kind === 'mortar'));
    const regular = weapons.create(loadouts.find(weapon => weapon.kind === 'cannon'));
    const firingPose = Transform.pose(205, 500);
    const launch = weapon => {
        weapon.requestFire(target);
        for (let frame = 0; frame < 120; frame++) {
            weapon.update(1 / 60, firingPose, [target]);
            const shot = weapon.takeShot(firingPose);
            if (shot) return shot;
        }
        throw new Error('Weapon failed to launch');
    };
    const rapidFirst = launch(rapid), heavyFirst = launch(heavy), regularFirst = launch(regular);
    assert(rapidFirst.attack === 1 && heavyFirst.attack === 8 && regularFirst.attack === 2,
        'Gatling uses weak ammunition and level-four mortar uses powerful ammunition');
    assert(!rapid.isReady && !heavy.isReady && !regular.isReady, 'all weapons begin reloading after a shot');
    rapid.update(0.06, firingPose, [target]); heavy.update(0.06, firingPose, [target]); regular.update(0.06, firingPose, [target]);
    assert(rapid.isReady && !heavy.isReady && !regular.isReady, 'Gatling reloads independently in fifty milliseconds');
    rapid.requestFire({ ...target, id: 100 });
    rapid.update(0, firingPose, [{ ...target, id: 100 }]);
    const rapidSecond = rapid.takeShot(firingPose);
    assert(rapidSecond && rapidFirst.age === 0 && !rapidFirst.hit && rapidSecond.targetId === 100,
        'reloaded gun fires again while its earlier projectile remains in flight');
    regular.update(0.35, firingPose, [target]); heavy.update(0.35, firingPose, [target]);
    assert(regular.isReady && !heavy.isReady && heavy.reloadRemaining > 1.3,
        'regular cannon reloads sooner than the level-four heavy weapon');
    heavy.requestFire({ ...target, id: 101 });
    heavy.update(0.5, firingPose, [{ ...target, id: 101 }]);
    assert(heavy.takeShot(firingPose) === null, 'heavy weapon cannot bypass its long reload');
    heavy.update(0.9, firingPose, [{ ...target, id: 101 }]);
    const heavySecond = heavy.takeShot(firingPose);
    assert(heavySecond && heavySecond.targetId === 101 && heavyFirst.age === 0,
        'heavy weapon can fire when its own reload completes without waiting for impact');
    game.start(); factory.upgrade(game.player, 4); game.score = 1000; game.spawnTime = 100;
    const readyRounds = Array.from({ length: 5 }, () => projectile('A', { health: 10, maxHealth: 10 }));
    game.enemies = [{ ...queuePlane, health: 1 }]; game.projectiles = readyRounds;
    game.intercept('A');
    for (let frame = 0; frame < 120 && game.shells.length < 4; frame++) game.shells.push(...game.player.update(1 / 60, game.getTargets()));
    const gatling = game.player.weapons.find(weapon => weapon.definition.kind === 'rotary');
    for (let frame = 0; frame < 5; frame++) game.shells.push(...game.player.update(1 / 60, game.getTargets()));
    const countBeforeReloadedInput = game.shells.length;
    game.intercept('A');
    assert(gatling.pendingTargetIds[0] === readyRounds[4].id
        && game.player.weapons.find(weapon => weapon.definition.kind === 'mortar').pendingTargetIds.length === 0,
        'letter input assigns the next FIFO target to a loaded gun and skips the reloading mortar');
    for (let frame = 0; frame < 60 && game.shells.length === countBeforeReloadedInput; frame++) game.shells.push(...game.player.update(1 / 60, game.getTargets()));
    assert(game.shells.length > countBeforeReloadedInput && game.shells.filter(shot => shot.weaponId === gatling.definition.id).length >= 2,
        'Gatling produces multiple independent in-flight projectiles at its fast fire rate');
    game.start(); factory.upgrade(game.player, 3); game.score = 500; game.spawnTime = 100;
    const single = projectile('A', { health: 20, maxHealth: 20 });
    game.enemies = []; game.projectiles = [single];
    game.intercept('A');
    const singleGatling = game.player.weapons.find(weapon => weapon.definition.kind === 'rotary');
    assert(singleGatling.pendingTargetIds[0] === single.id
        && game.player.weapons.filter(weapon => weapon.definition.kind !== 'rotary').every(weapon => !weapon.hasPendingTarget),
        'Gatling receives a target even when only one target exists');
    for (let frame = 0; frame < 120 && !game.shells.length; frame++) game.shells.push(...game.player.update(1 / 60, game.getTargets()));
    assert(game.shells.length === 1 && game.shells[0] instanceof RotaryBullet
        && game.shells[0].weaponId === singleGatling.definition.id, 'single-target letter input actually launches Gatling ammunition');
    const fairTank = factory.createPlayer(3), turns = new Map();
    for (let turn = 0; turn < 9; turn++) {
        const next = { ...target, id: 20000 + turn };
        assert(fairTank.fireAt(next), `fair firing turn ${turn + 1} accepted`);
        let fired;
        for (let frame = 0; frame < 120 && !fired; frame++) fired = fairTank.update(1 / 60, [next])[0];
        assert(!!fired, `fair firing turn ${turn + 1} emits a projectile`);
        turns.set(fired.weaponId, (turns.get(fired.weaponId) ?? 0) + 1);
        for (let frame = 0; frame < 60; frame++) fairTank.update(1 / 60, [next]);
    }
    assert(fairTank.weapons.every(weapon => turns.get(weapon.definition.id) === 3),
        'slow single-target typing fairly rotates through every gun without starving Gatling or cannons');
    const evolving = factory.createPlayer(2);
    evolving.fireAt(target);
    for (let frame = 0; frame < 120; frame++) evolving.update(1 / 60, [target]);
    factory.upgrade(evolving, 3);
    assert(evolving.readyWeapons[0].definition.kind === 'rotary', 'newly unlocked Gatling is prioritized over previously used weapons');
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = '#e4efe1'; c.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < 4; i++) {
        const tank = poses[i];
        tank.x = 230 + (i % 2) * 600; tank.y = 320 + Math.floor(i / 2) * 440;
        tank.moveTo(tank.x);
        tank.fireAt({ ...target, x: tank.x + 600, y: tank.y + 50 });
        for (let frame = 0; frame < 12; frame++) tank.update(1 / 60, [{ ...target, x: tank.x + 600, y: tank.y + 50 }]);
        tank.x = 230 + (i % 2) * 600;
        c.save(); c.fillStyle = '#294d41'; c.font = 'bold 22px sans-serif'; c.fillText(`Level ${tank.level}`, 50 + (i % 2) * 600, 45 + Math.floor(i / 2) * 440); c.restore();
        tank.render(c);
    }
    document.documentElement.dataset.result = 'passed';
    document.querySelector('#results').textContent = `${checks.length} checks passed\n${checks.join('\n')}`;
} catch (error) {
    document.documentElement.dataset.result = 'failed';
    document.querySelector('#results').textContent = `${error.stack}\nPassed:\n${checks.join('\n')}`;
} finally { game?.destroy(); }
</script></body></html>
